plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.tonnet.browser'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.tonnet.browser'
        minSdk = 28
        targetSdk = 36
        versionCode = 200001
        versionName = '2.0.0-beta'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions += 'channel'
    productFlavors {
        prod {
            dimension = 'channel'
            resValue 'string', 'app_name', 'TON Browser'
        }
        beta {
            dimension = 'channel'
            applicationIdSuffix = '.beta'
            resValue 'string', 'app_name', 'TON Browser Beta'
        }
    }

    buildTypes {
        debug {
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            ndk {
                abiFilters 'arm64-v8a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    testOptions {
        managedDevices {
            localDevices {
                pixel2Api28 {
                    device = 'Pixel 2'
                    apiLevel = 28
                    systemImageSource = 'aosp'
                }
                pixel2Api36 {
                    device = 'Pixel 2'
                    apiLevel = 36
                    systemImageSource = 'aosp'
                }
            }
        }
    }

    lint {
        warningsAsErrors = true
        disable 'ChromeOsAbiSupport', 'GradleDependency'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation project(':browser-core')
    implementation project(':ton-proxy-android')

    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.github.Dimezis:BlurView:version-3.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
