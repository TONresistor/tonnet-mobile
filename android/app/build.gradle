import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'com.diffplug.spotless'

def packageMetadataFile = rootProject.file('../package.json')
if (!packageMetadataFile.isFile()) {
    throw new GradleException("Missing package metadata: ${packageMetadataFile}")
}
def packageMetadata = new JsonSlurper().parse(packageMetadataFile)
def appVersionName = packageMetadata.version?.toString()
if (!appVersionName) {
    throw new GradleException('package.json must contain a non-empty version')
}

android {
    namespace = "com.tonnet.browser"
    ndkVersion "27.1.12297006"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tonnet.browser"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName appVersionName
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }

        // NDK configuration for native libraries
        // Only arm64-v8a is available for tonutils-proxy
        ndk {
            abiFilters 'arm64-v8a'
        }

        // CMake configuration for JNI bridge
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    // CMake build configuration
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1"
        }
    }

    // Include prebuilt native libraries
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    flavorDimensions "channel"
    productFlavors {
        prod {
            dimension "channel"
        }
        beta {
            dimension "channel"
            applicationIdSuffix ".beta"
            resValue "string", "app_name", "Tonnet Browser Beta"
        }
    }
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        googleJavaFormat('1.24.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format('gradle') {
        target 'build.gradle'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs'
    }
}

dependencies {
    // Include JAR files from libs directory
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // AndroidX dependencies
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // WebKit for ProxyController (required for WebView proxy configuration)
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"

    // Capacitor
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // Leak detection (debug only)
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    // Testing
    testImplementation "junit:junit:$junitVersion"
}

apply from: 'capacitor.build.gradle'
