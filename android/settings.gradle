pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'JitPackBlurView'
                    url = uri('https://jitpack.io')
                }
            }
            filter {
                includeModule('com.github.Dimezis', 'BlurView')
            }
        }
    }
}

rootProject.name = "tonnet-mobile"
include ':app'
include ':browser-core'
include ':ton-proxy-android'
