plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'com.android.library' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
}

allprojects {
    dependencyLocking {
        lockAllConfigurations()
    }
}

tasks.register('qualityGate') {
    group = 'verification'
    description = 'Runs the shared local, CI, and release Android quality checks.'
    dependsOn(
        ':ton-proxy-android:buildNativeProxy',
        ':browser-core:testDebugUnitTest',
        ':ton-proxy-android:testDebugUnitTest',
        ':app:testBetaDebugUnitTest',
        ':browser-core:lintDebug',
        ':ton-proxy-android:lintDebug',
        ':app:lintBetaDebug',
        ':app:assembleBetaDebug',
        ':app:assembleBetaDebugAndroidTest',
    )
}
