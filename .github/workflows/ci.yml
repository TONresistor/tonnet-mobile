name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GO_VERSION: "1.25.12"
  GOVULNCHECK_VERSION: "v1.6.0"
  TONNET_RUN_GOVULNCHECK: "1"
  GOTOOLCHAIN: local
  ANDROID_PLATFORM_VERSION: "36"
  BUILD_TOOLS_VERSION: "36.0.0"
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  verify:
    name: Native Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --fail-with-body --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint
          "$install_dir/actionlint" -shellcheck=""

      - name: Enforce repository boundaries
        run: ./scripts/verify-repository-hygiene.sh

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android toolchain
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --install
          "platforms;android-${ANDROID_PLATFORM_VERSION}"
          "build-tools;${BUILD_TOOLS_VERSION}"
          "ndk;${NDK_VERSION}"
          "cmake;${CMAKE_VERSION}"
          "emulator"
          "system-images;android-28;default;x86_64"
          "system-images;android-${ANDROID_PLATFORM_VERSION};default;x86_64"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false

      - name: Install pinned Go vulnerability scanner
        run: |
          install_dir="$RUNNER_TEMP/go-tools"
          mkdir -p "$install_dir"
          GOBIN="$install_dir" go install \
            "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run shared Android quality gate
        working-directory: android
        run: ./gradlew --no-daemon qualityGate

      - name: Run network-independent Android tests
        working-directory: android
        run: >-
          ./gradlew --no-daemon
          pixel2Api36BetaDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Verify unsupported WebView handling on Android 9
        working-directory: android
        run: >-
          ./gradlew --no-daemon
          pixel2Api28BetaDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=com.tonnet.browser.web.WebViewCompatibilitySmokeTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Verify APK signature and 16 KiB compatibility
        run: ./scripts/verify-apk.sh android/app/build/outputs/apk/beta/debug/app-beta-debug.apk

      - name: Upload tested debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tonnet-beta-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/beta/debug/app-beta-debug.apk
          if-no-files-found: error
          retention-days: 7

  notify:
    needs: verify
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'

    steps:
      - name: Checkout notification context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets not configured, skipping"
            exit 0
          fi

          null_sha="0000000000000000000000000000000000000000"
          repository_url="${{ github.server_url }}/${{ github.repository }}"

          if [[ "$BEFORE_SHA" == "$null_sha" ]] ||
            ! git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null; then
            count="$(git rev-list --count "$AFTER_SHA")"
            range="$AFTER_SHA"
            commits_url="$repository_url/commits/$BRANCH"
          else
            count="$(git rev-list --count "$BEFORE_SHA..$AFTER_SHA")"
            range="$BEFORE_SHA..$AFTER_SHA"
            commits_url="$repository_url/compare/$BEFORE_SHA...$AFTER_SHA"
          fi

          noun="commits"
          [[ "$count" == "1" ]] && noun="commit"
          repository_name="${repository_url##*/}"
          label="$(printf '%s' "$BRANCH" | tr '[:lower:]' '[:upper:]')"
          text="<b>[$label] $repository_name</b>"
          if [[ "$VERIFY_RESULT" == "success" ]]; then
            printf -v text '%s\n%s %s pushed to %s' \
              "$text" "$count" "$noun" "$BRANCH"
          else
            printf -v text '%s\nCI failed on %s (%s %s)' \
              "$text" "$BRANCH" "$count" "$noun"
          fi

          maximum_titles=50
          titles="$(
            git log --reverse --max-count="$maximum_titles" --pretty=format:'%s' "$range" |
              sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          )"
          if (( count > maximum_titles )); then
            printf -v titles '%s\n… and %s more' \
              "$titles" "$((count - maximum_titles))"
          fi
          if (( count > 1 )); then
            printf -v text '%s\n\n<blockquote expandable>%s</blockquote>' \
              "$text" "$titles"
          elif [[ -n "$titles" ]]; then
            printf -v text '%s\n\n<blockquote>%s</blockquote>' "$text" "$titles"
          fi
          printf -v text '%s\n\n<a href="%s">View commits</a>' "$text" "$commits_url"

          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=$text"
